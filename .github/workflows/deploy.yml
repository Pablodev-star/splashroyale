name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report whether this workflow is the only thing publishing the site
        # The blank page that survived four fixes was two publishers racing.
        # Pages is set to "Deploy from a branch", so every push to main
        # triggers a legacy build that publishes the *repository root* while
        # this workflow publishes dist/. Whichever finishes last is the live
        # site, so the same commit served a working app or a blank page
        # depending on a race — which looks exactly like a caching bug from a
        # device, and is why it was chased as one for so long.
        #
        # This reports and does not fail. An earlier version exited 1 here, and
        # that was worse than the bug: it stopped the *good* publisher, leaving
        # the legacy one unopposed, so the site went from intermittently broken
        # to always broken. A check that disables the working half of a race is
        # not a safety net.
        #
        # The repository is made to work under either publisher instead — see
        # the committed root bundle below. Fixing the setting (Settings ->
        # Pages -> Source -> GitHub Actions) makes that scaffolding removable.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          build_type="$(
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              | jq -r '.build_type // "unknown"'
          )"
          echo "Pages build_type: ${build_type}"
          if [ "$build_type" = "workflow" ]; then
            echo "Only this workflow publishes. The root bundle fallback is no"
            echo "longer needed and can be deleted (app.js, app.css, .nojekyll)."
          else
            echo "::warning::Pages source is '${build_type}', not 'workflow': a legacy"
            echo "::warning::branch build publishes the repository root and races this"
            echo "::warning::workflow on every push. The committed root bundle keeps the"
            echo "::warning::site working either way, but fix it at Settings -> Pages."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the root bundle fallback is not stale
        # app.js and app.css are committed at the repository root so that the
        # legacy branch build — which publishes the root, not dist/ — serves a
        # site that actually runs. The root index.html there is the source
        # template, so its own entry (/src/main.tsx) 404s and the watchdog
        # injects ./app.js instead; that only works if ./app.js is present and
        # current.
        #
        # A warning rather than a failure: a stale root bundle still boots an
        # older build of the game, and blocking the deploy over it would once
        # again take out the publisher that serves the *correct* build.
        continue-on-error: true
        run: |
          set -eu
          stale=0
          for asset in app.js app.css; do
            if [ ! -f "$asset" ]; then
              echo "::warning::${asset} is missing from the repository root."
              stale=1
            elif ! cmp -s "dist/$asset" "$asset"; then
              echo "::warning::Root ${asset} differs from the build output."
              stale=1
            fi
          done
          if [ "$stale" = "1" ]; then
            echo "::warning::A legacy branch build would serve an older game than this"
            echo "::warning::deploy. Refresh with: npm run build && cp dist/app.js dist/app.css ."
          else
            echo "Root bundle fallback matches the build."
          fi
      - name: Check the deploy cannot reproduce the blank page
        # The blank page was one stale index.html in a browser cache, asking
        # for an entry script that is not on the server. What makes that
        # survivable is that the shell can repair itself: asset names are
        # fixed, so the watchdog can inject the real bundle into a document of
        # any vintage. Every check below protects that property.
        #
        # It is invisible on a development machine — where the shell is always
        # the one just built — so it is checked here rather than trusted to a
        # config file staying the way it is.
        run: |
          set -eu
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/app.js     || { echo "dist/app.js missing";     exit 1; }

          hashed="$(find dist -type f -regex '.*-[A-Za-z0-9_]\{8\}\.\(js\|css\)' -print)"
          if [ -n "$hashed" ]; then
            echo "Content-hashed assets emitted; a cached index.html could 404 on these:"
            echo "$hashed"
            exit 1
          fi

          html_bytes="$(wc -c < dist/index.html)"
          if [ "$html_bytes" -gt 200000 ]; then
            echo "index.html is ${html_bytes} bytes — the bundle looks inlined again."
            echo "An inlined bundle has no ./app.js next to it, so a stale shell"
            echo "could no longer repair itself, and every deploy would ship a"
            echo "megabyte of HTML that browsers cache as one indivisible unit."
            exit 1
          fi

          grep -q 'src="./app.js?v=' dist/index.html || {
            echo "index.html does not reference ./app.js with a cache-busting version"; exit 1;
          }

          # The watchdog names the bundle itself, so it can inject the real one
          # into a shell that asked for something else — which is how a device
          # holding a stale index.html recovers instead of showing a dead page.
          # That only works while the two names agree.
          grep -q "var ENTRY = 'app.js';" dist/index.html || {
            echo "The watchdog's ENTRY no longer matches the emitted bundle name."
            echo "Recovery from a stale cached shell would silently stop working."
            exit 1
          }

          echo "OK: shell ${html_bytes} bytes, app.js $(wc -c < dist/app.js) bytes, no hashed names"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
