name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the deploy cannot reproduce either blank page
        # Two different blank pages have shipped from this repo, and the fix
        # for each is an invariant the other would break:
        #
        #   1. A cached index.html asking for a content-hashed asset a later
        #      deploy had replaced. Guarded by asset names never being hashed.
        #   2. The whole app inlined into one <script>, which an engine
        #      silently truncated once it grew past ~945 kB. Guarded by
        #      index.html staying small, i.e. nothing being inlined.
        #
        # Both are invisible on a development machine, so they are checked here
        # rather than trusted to a config file staying the way it is.
        run: |
          set -eu
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/app.js     || { echo "dist/app.js missing";     exit 1; }

          hashed="$(find dist -type f -regex '.*-[A-Za-z0-9_]\{8\}\.\(js\|css\)' -print)"
          if [ -n "$hashed" ]; then
            echo "Content-hashed assets emitted; a cached index.html could 404 on these:"
            echo "$hashed"
            exit 1
          fi

          html_bytes="$(wc -c < dist/index.html)"
          if [ "$html_bytes" -gt 200000 ]; then
            echo "index.html is ${html_bytes} bytes — the bundle looks inlined again."
            echo "That is the failure where an engine drops an oversized inline script."
            exit 1
          fi

          grep -q 'src="./app.js?v=' dist/index.html || {
            echo "index.html does not reference ./app.js with a cache-busting version"; exit 1;
          }

          echo "OK: shell ${html_bytes} bytes, app.js $(wc -c < dist/app.js) bytes, no hashed names"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
