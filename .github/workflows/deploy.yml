name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Keep the previous deploy's hashed assets reachable
        # Vite content-hashes JS/CSS filenames, and each deploy otherwise replaces
        # the last one's files outright. A browser holding a cached index.html from
        # the previous deploy still points at those old filenames — if they 404,
        # the app never mounts and the page is just blank, with no visible error.
        # GitHub Pages serves static files as-is with no custom response-header
        # support, so the fix is structural: fetch whatever the live site's
        # previous index.html referenced and carry those specific files forward
        # into this build's output, alongside the new ones. Best-effort — a site
        # that isn't live yet (first deploy) or a network hiccup just no-ops.
        run: |
          set -u
          site_url="https://pablodev-star.github.io/splashroyale/"
          prev_html="$(curl -fsSL "$site_url" 2>/dev/null || true)"
          if [ -n "$prev_html" ]; then
            echo "$prev_html" | grep -oE '\./assets/[A-Za-z0-9._-]+\.(js|css)' | sort -u | while read -r asset; do
              dest="dist/${asset#./}"
              if [ ! -f "$dest" ]; then
                mkdir -p "$(dirname "$dest")"
                curl -fsSL "${site_url}${asset#./}" -o "$dest" || rm -f "$dest"
              fi
            done
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
