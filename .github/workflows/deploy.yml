name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the build really is one self-contained file
        # The blank-page bug this guards against was caused by a cached
        # index.html referencing hashed asset files a later deploy had replaced.
        # The build now inlines everything, so if an assets/ directory ever
        # reappears (a plugin ordering change, a new asset type Vite decides to
        # emit separately) the guarantee is silently gone. Fail loudly instead.
        run: |
          set -eu
          if [ ! -f dist/index.html ]; then
            echo "dist/index.html missing"; exit 1
          fi
          extra="$(find dist -type f ! -name index.html)"
          if [ -n "$extra" ]; then
            echo "Build emitted files outside index.html; single-file guarantee broken:"
            echo "$extra"
            exit 1
          fi
          echo "OK: dist is a single self-contained index.html ($(wc -c < dist/index.html) bytes)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
