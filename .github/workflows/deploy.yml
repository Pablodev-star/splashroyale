name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check this workflow is the only thing publishing the site
        # The blank page that survived four fixes was two publishers racing.
        # Pages was left on "Deploy from a branch", so every push to main
        # triggered a legacy build that published the *repository root* —
        # including the untransformed index.html, whose entry is /src/main.tsx
        # and which no browser can run — while this workflow published dist/.
        # Whichever finished last was the live site, so the same commit served
        # a working app or a blank page depending on a race. It looks exactly
        # like a caching bug from the outside, which is why it was chased as
        # one for so long.
        #
        # A setting outside the repository cannot be fixed by a commit, so it
        # is asserted here instead: if anyone flips the source back, the deploy
        # fails loudly rather than shipping a coin toss.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          build_type="$(
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              | jq -r '.build_type // "unknown"'
          )"
          echo "Pages build_type: ${build_type}"
          if [ "$build_type" = "legacy" ]; then
            echo "::error::Pages is set to 'Deploy from a branch'. That publishes the"
            echo "::error::repository root — the untransformed index.html, which asks for"
            echo "::error::/src/main.tsx and cannot run — racing this workflow on every push."
            echo "::error::Fix: Settings -> Pages -> Source -> GitHub Actions."
            exit 1
          fi
          if [ "$build_type" != "workflow" ]; then
            echo "::warning::Could not read the Pages source (got '${build_type}')."
            echo "::warning::Check Settings -> Pages -> Source is 'GitHub Actions'."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the deploy cannot reproduce the blank page
        # The blank page was one stale index.html in a browser cache, asking
        # for an entry script that is not on the server. What makes that
        # survivable is that the shell can repair itself: asset names are
        # fixed, so the watchdog can inject the real bundle into a document of
        # any vintage. Every check below protects that property.
        #
        # It is invisible on a development machine — where the shell is always
        # the one just built — so it is checked here rather than trusted to a
        # config file staying the way it is.
        run: |
          set -eu
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/app.js     || { echo "dist/app.js missing";     exit 1; }

          hashed="$(find dist -type f -regex '.*-[A-Za-z0-9_]\{8\}\.\(js\|css\)' -print)"
          if [ -n "$hashed" ]; then
            echo "Content-hashed assets emitted; a cached index.html could 404 on these:"
            echo "$hashed"
            exit 1
          fi

          html_bytes="$(wc -c < dist/index.html)"
          if [ "$html_bytes" -gt 200000 ]; then
            echo "index.html is ${html_bytes} bytes — the bundle looks inlined again."
            echo "An inlined bundle has no ./app.js next to it, so a stale shell"
            echo "could no longer repair itself, and every deploy would ship a"
            echo "megabyte of HTML that browsers cache as one indivisible unit."
            exit 1
          fi

          grep -q 'src="./app.js?v=' dist/index.html || {
            echo "index.html does not reference ./app.js with a cache-busting version"; exit 1;
          }

          # The watchdog names the bundle itself, so it can inject the real one
          # into a shell that asked for something else — which is how a device
          # holding a stale index.html recovers instead of showing a dead page.
          # That only works while the two names agree.
          grep -q "var ENTRY = 'app.js';" dist/index.html || {
            echo "The watchdog's ENTRY no longer matches the emitted bundle name."
            echo "Recovery from a stale cached shell would silently stop working."
            exit 1
          }

          echo "OK: shell ${html_bytes} bytes, app.js $(wc -c < dist/app.js) bytes, no hashed names"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
