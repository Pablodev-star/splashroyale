<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#04121f" />
    <!-- Every deploy renames the built JS/CSS (content hash), so a cached copy of
         this shell can point at files that no longer exist on the next deploy —
         the script tag then fails silently and the page never mounts, just a
         blank white screen. Tell the browser to always revalidate this document. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Splash Royale</title>
    <meta
      name="description"
      content="Splash Royale — PvP pixel art aquatic combat. Charge your water attacks, dive to escape, and collect ability cards."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
