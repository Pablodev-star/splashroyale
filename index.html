<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#04121f" />
    <!-- The bundle is an external file with a *stable* name (see
         vite.config.ts): a cached copy of this document always asks for
         ./app.js, which always exists, so the hashed-filename 404 that caused
         the blank page cannot happen — and the watchdog below can repair a
         shell that asks for anything else, because it knows that name.
         These hints ask for a fresh copy anyway; they are NOT load-bearing and
         never were. Meta cache directives are not honoured as real caching
         headers, which is exactly why a stale shell survived this long. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='%2304121f'/><path d='M1 5h3v2H1zM4 4h3v2H4zM7 5h3v2H7zM10 4h3v2h-3zM13 5h2v2h-2z' fill='%231878a8'/><path d='M1 8h3v2H1zM4 7h3v2H4zM7 8h3v2H7zM10 7h3v2h-3zM13 8h2v2h-2z' fill='%2334b6d8'/><path d='M1 11h3v2H1zM4 10h3v2H4zM7 11h3v2H7zM10 10h3v2h-3zM13 11h2v2h-2z' fill='%239ef0f5'/></svg>" />
    <title>Splash Royale</title>
    <meta
      name="description"
      content="Splash Royale — PvP pixel art aquatic combat. Charge your water attacks, dive to escape, and collect ability cards."
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Every fix so far for the blank-page bug targeted the build/deploy
      pipeline (stale cached assets, multi-file version mismatches) and was
      verified from a development machine — never from the browser that
      actually reported blank. If the cause turns out to be something else
      entirely (a script parse error on an older engine, a runtime exception
      before React mounts, a network failure), nothing above would catch it,
      and there'd be no way to know without remote devtools.

      This script is deliberately NOT part of the bundle: it's plain ES5 in a
      classic (non-module) tag, so it parses and runs on essentially anything,
      independently of whether the module script below succeeds. It watches
      for #root staying empty and, if so, renders a diagnostic in plain DOM
      calls — no framework, nothing that itself could fail the same way.
    -->
    <script>
      (function () {
        var lastError = null;

        // The built bundle's filename, which vite.config.ts keeps stable
        // precisely so this script can name it without knowing the build
        // (ENTRY_JS there; CI fails the build if the two drift apart). Naming
        // it is what makes recovery from a wrong shell possible at all.
        var ENTRY = 'app.js';

        /** Set once recoverBundle has run; also the reason, for the report. */
        var recoveryReason = null;
        /** Whether the report already granted recovery its grace period. */
        var recoveryGraced = false;

        // A Content-Security-Policy that blocks inline scripts (injected by a
        // network-level filter or proxy ahead of this page, since nothing
        // here sets one) fires this event instead of a normal script error —
        // and does so even for the script that got blocked, so this needs to
        // be registered before anything else has a chance to be stopped.
        var cspViolations = [];
        document.addEventListener('securitypolicyviolation', function (event) {
          cspViolations.push(
            (event.violatedDirective || '?') + ' blocked ' + (event.blockedURI || '?')
          );
        });

        // Resource load failures — the bundle 404ing, a network drop mid-fetch
        // — do not bubble, so they are only visible on the capture phase and
        // are invisible to the plain `error` handler below.
        //
        // This is not a hypothetical channel: it is the one that finally
        // explained the blank page, after four fixes aimed at the wrong
        // thing. The report said
        //
        //     Bundle: /src/main.tsx  — FAILED TO LOAD
        //
        // and /src/main.tsx is the *dev* entry, which exists only in the
        // untransformed source template. No build produces that document, so
        // the server was serving the repository root — a legacy Pages branch
        // build racing the workflow on every push, each publishing a
        // different site (see the guard in .github/workflows/deploy.yml).
        //
        // That cause is a repository setting, not something this file can fix.
        // What this file can do is make such a document survivable instead of
        // dead, whether it arrives from a bad publish or a stale cache.
        var resourceErrors = [];
        window.addEventListener(
          'error',
          function (event) {
            var target = event && event.target;
            if (!target || target === window || !target.tagName) return;
            var url = target.src || target.href || '?';
            resourceErrors.push(target.tagName.toLowerCase() + ' failed: ' + url);

            // A shell whose entry script 404s cannot recover on its own —
            // nothing in it will ever run, and reloading just re-serves the
            // same cached document. But asset names are stable now, so the
            // repair is possible from inside the broken page: ./app.js sits
            // next to whatever index.html the browser holds, whatever its
            // vintage. Fixes the dev-template case above and the original
            // failure (a cached shell asking for a content-hashed asset a
            // later deploy replaced) with the same three lines.
            if (
              target.tagName.toLowerCase() === 'script' &&
              target.type === 'module' &&
              url.indexOf('/' + ENTRY) === -1 // Not the real bundle: retrying would loop.
            ) {
              recoverBundle('entry script 404 (' + url + '), injected ./' + ENTRY);
            }
          },
          true
        );

        /**
         * Loads the real bundle into a shell that asked for the wrong one.
         *
         * Once only, and never for a failure of the bundle itself, so a
         * genuinely missing app cannot turn into a reload loop.
         */
        function recoverBundle(reason) {
          if (recoveryReason) return;
          recoveryReason = reason;

          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './app.css';
          document.head.appendChild(css);

          var script = document.createElement('script');
          script.type = 'module';
          script.src = './' + ENTRY;
          // Recovery only patches this page view. Replace the cached document
          // too, or the next visit starts from the same broken shell.
          script.addEventListener('load', refreshCachedShell);
          document.body.appendChild(script);
        }

        /**
         * Re-fetches this document from the network, updating the HTTP cache
         * entry behind it.
         *
         * The stale shell is the whole bug, and it survives ordinary reloads —
         * the meta cache hints in <head> are not real caching directives, and
         * Pages serves static files with no way to set response headers. This
         * is the one lever the page itself has. Cheap: the shell is ~12 kB.
         */
        var shellRefreshed = false;
        function refreshCachedShell() {
          if (shellRefreshed || !window.fetch) return;
          shellRefreshed = true;
          try {
            window.fetch(location.href, { cache: 'reload' })['catch'](function () {});
          } catch (refreshError) {
            /* Offline, or an engine without it. Nothing to do. */
          }
        }

        window.addEventListener('error', function (event) {
          lastError = (event && event.message) || 'Unknown script error';
          if (event && event.filename) {
            lastError += ' (' + event.filename + ':' + event.lineno + ')';
          }
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          lastError = 'Unhandled promise rejection: ' + (reason && reason.message ? reason.message : String(reason));
        });

        function report() {
          var root = document.getElementById('root');
          if (!root || root.firstChild) {
            // App mounted normally. A more reliable moment to catch that than
            // `load` is, since React may commit just after it.
            if (root) refreshCachedShell();
            return;
          }

          // Recovery is downloading a fresh ~945 kB bundle. Give that its own
          // grace period rather than accusing a page that is busy fixing
          // itself; if it does not arrive, the report runs after all and says
          // that recovery was tried.
          if (recoveryReason && !recoveryGraced) {
            recoveryGraced = true;
            window.setTimeout(report, 20000);
            return;
          }

          // Second channel, independent of the event listeners above: WebKit
          // has a documented history of not reliably firing `error` for
          // module-script exceptions the way classic scripts do. main.tsx
          // catches its own top-level render call and stashes the error here,
          // so a report of "no captured error" is only possible when nothing
          // in application code threw at all — which points at a genuine
          // parse-time or environmental failure rather than a runtime bug.
          if (!lastError && window.__SPLASH_BOOT_ERROR__) {
            var boot = window.__SPLASH_BOOT_ERROR__;
            lastError = boot && boot.message ? boot.message : String(boot);
          }

          // Third channel: where main.tsx got to before stalling, even when
          // nothing threw. 'module-evaluating' (or unset) means the module
          // script never ran at all; 'importing-app' or 'rendering' stuck
          // there means it hung awaiting something instead of erroring.
          var bootStage = window.__SPLASH_BOOT_STAGE__ || '(module script never ran)';

          var box = document.createElement('div');
          box.setAttribute('data-diagnostic', 'blank-page-fallback');
          box.setAttribute(
            'style',
            'position:fixed;inset:0;background:#04121f;color:#e8fbff;' +
              'font-family:ui-monospace,monospace;font-size:13px;line-height:1.5;' +
              'padding:24px;box-sizing:border-box;overflow:auto;z-index:99999'
          );

          var title = document.createElement('div');
          title.textContent = 'Splash Royale did not start';
          title.setAttribute('style', 'font-weight:bold;font-size:16px;margin-bottom:12px');
          box.appendChild(title);

          var body = document.createElement('div');
          body.textContent =
            'The page loaded, but the app never mounted. This is diagnostic ' +
            'output, not a normal error screen — please share this text.';
          box.appendChild(body);

          // Cheap probes for the environmental causes that would explain "no
          // error, nothing ran" without a code bug: JS disabled for storage
          // (private mode lockdowns), a content blocker stripping inline
          // scripts, or canvas/WebGL restrictions. Each is wrapped separately
          // so one probe failing does not blank the rest of the report.
          function probe(fn, fallback) {
            try {
              return fn();
            } catch (probeError) {
              return fallback + ' (probe failed: ' + probeError.message + ')';
            }
          }
          var storageWorks = probe(function () {
            var key = '__splash_probe__';
            window.localStorage.setItem(key, '1');
            window.localStorage.removeItem(key);
            return 'yes';
          }, 'no');
          var canvas2d = probe(function () {
            return document.createElement('canvas').getContext('2d') ? 'yes' : 'no';
          }, 'unknown');
          var webgl = probe(function () {
            var gl = document.createElement('canvas').getContext('webgl2') ||
              document.createElement('canvas').getContext('webgl');
            return gl ? 'yes' : 'no';
          }, 'unknown');
          var scriptCount = probe(function () {
            return String(document.getElementsByTagName('script').length);
          }, 'unknown');
          // Where the bundle was supposed to come from, and whether it
          // arrived. This replaces a probe that measured the *inline* script's
          // length, which was the right question while the whole app lived
          // inside the tag — and is how the last failure was diagnosed: it
          // reported 0 characters for a 945 kB inline script, proving the
          // engine had discarded it. The bundle is external now, so the
          // meaningful question is whether the file loaded.
          var bundle = probe(function () {
            var el = document.querySelector('script[type="module"]');
            if (!el) return '(no script[type=module] element in DOM)';
            if (!el.src) return 'inline, ' + el.textContent.length + ' characters';
            // Matched on `el.src` (absolute) rather than the attribute: the
            // attribute is relative — "./app.js?v=..." — while the error entry
            // carries the resolved URL, so comparing the two never matched and
            // a genuinely missing bundle was reported as loading fine.
            var failed = resourceErrors.some(function (entry) {
              return entry.indexOf(el.src) !== -1;
            });
            return el.getAttribute('src') + (failed ? '  — FAILED TO LOAD' : '  (no load error)');
          }, 'unknown');
          var readyState = probe(function () {
            return document.readyState;
          }, 'unknown');

          var detail = document.createElement('pre');
          detail.setAttribute(
            'style',
            'margin-top:16px;white-space:pre-wrap;word-break:break-word;' +
              'background:#0a2540;padding:12px;border:1px solid #1878a8'
          );
          detail.textContent =
            'Captured error: ' + (lastError || '(none — script may not have run at all)') + '\n' +
            'Boot stage reached: ' + bootStage + '\n' +
            'CSP violations: ' + (cspViolations.length ? cspViolations.join('; ') : 'none') + '\n' +
            'Bundle: ' + bundle + '\n' +
            'Failed resources: ' +
              (resourceErrors.length ? resourceErrors.join('; ') : 'none') + '\n' +
            'Recovery: ' + (recoveryReason || 'not attempted') + '\n' +
            'Document ready state: ' + readyState + '\n' +
            'URL: ' + location.href + '\n' +
            'User agent: ' + navigator.userAgent + '\n' +
            'localStorage works: ' + storageWorks + '\n' +
            'Canvas2D available: ' + canvas2d + '\n' +
            'WebGL available: ' + webgl + '\n' +
            'Script tags on page: ' + scriptCount;
          box.appendChild(detail);

          var reload = document.createElement('button');
          reload.textContent = 'Reload';
          reload.setAttribute(
            'style',
            'margin-top:16px;padding:10px 18px;background:#34b6d8;color:#04121f;' +
              'border:none;font-weight:bold;font-family:inherit;font-size:13px;cursor:pointer'
          );
          reload.addEventListener('click', function () {
            // A plain reload can be answered by the very cached document that
            // is broken — which is what made this bug look unfixable from the
            // device: the player reloads, gets the same dead shell, and there
            // is nothing else to try. A URL the cache has never seen forces
            // the document to come from the network. Nothing in the app reads
            // query parameters, so the extra one is inert.
            location.replace(location.pathname + '?fresh=' + Date.now() + location.hash);
          });
          box.appendChild(reload);

          document.body.appendChild(box);

          // Everything above is a guess about a page that is still live. An
          // exceptionally slow connection can deliver the bundle after the
          // deadline has passed, and React would then mount underneath this
          // overlay — leaving the player staring at a failure screen for an
          // app that is running fine behind it. Stand down the moment
          // anything reaches #root. Polling rather than MutationObserver
          // keeps this script to the ES5 that made it trustworthy; it is one
          // property read every 400ms, and it stops the instant it succeeds.
          var heal = window.setInterval(function () {
            if (!root.firstChild) return;
            window.clearInterval(heal);
            if (box.parentNode) box.parentNode.removeChild(box);
            refreshCachedShell();
          }, 400);
        }

        // While the app was inlined, the countdown could start at parse time:
        // the whole program had already arrived with the document, so 2.5s of
        // nothing meant something was genuinely wrong. The bundle is a
        // separate ~945 kB file now, and on a slow connection the download
        // alone can outlast that — the watchdog would accuse a page that is
        // merely still loading.
        //
        // `load` is the anchor to start from. Module scripts are deferred, so
        // it fires once app.js has been fetched *and* evaluated, and it fires
        // even when the fetch failed — which is exactly the case worth
        // reporting. What it does not survive is a connection that stalls
        // open forever, so an outer cap still reports eventually.
        var armed = false;
        function arm(delay) {
          if (armed) return;
          armed = true;
          window.setTimeout(report, delay);

          // A working load is the best chance to replace a bad cached shell,
          // and the failure this addresses went exactly the other way round:
          // the app ran, the player played, a reload was answered from cache,
          // and the page was dead again. A good session should leave a good
          // document behind it.
          var root = document.getElementById('root');
          if (root && root.firstChild) refreshCachedShell();
        }
        if (document.readyState === 'complete') {
          arm(2500);
        } else {
          window.addEventListener('load', function () {
            arm(2500);
          });
          window.setTimeout(function () {
            arm(0);
          }, 20000);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
